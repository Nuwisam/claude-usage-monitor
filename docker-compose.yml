name: claude-usage-monitor

services:
  claude_usage_monitor_mariadb:
    image: mariadb:11
    container_name: claude_usage_monitor_mariadb
    restart: unless-stopped
    command: >
      --default-time-zone=+00:00
      --innodb-buffer-pool-size=256M
      --innodb-flush-log-at-trx-commit=2
      --max-connections=64
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      TZ: UTC
    volumes:
      - ./data/mariadb:/var/lib/mysql
    networks:
      - claude-usage-monitor_internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  claude_usage_monitor_backend:
    # The context is the repo directory, not ./backend — the `ui` stage in the Dockerfile
    # builds frontend/. Without it COPY frontend/... sees no sources. .dockerignore keeps
    # the context small.
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        VITE_BASE_PATH: ${APP_BASE_PATH:-/claude-usage}/
    container_name: claude_usage_monitor_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+aiomysql://${MARIADB_USER}:${MARIADB_PASSWORD}@claude_usage_monitor_mariadb:3306/${MARIADB_DATABASE}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: UTC
      # No default value — deliberately. An unset AUTH_MODE stops the container at
      # startup instead of deciding for the installer whether the data is to be open.
      AUTH_MODE: ${AUTH_MODE}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS}
      AUTH_EMAIL_HEADER: ${AUTH_EMAIL_HEADER:-X-Forwarded-Email}
      AUTH_VERIFY_URL: ${AUTH_VERIFY_URL:-}
      AUTH_EMAIL_FIELD: ${AUTH_EMAIL_FIELD:-email}
      AUTH_VERIFIED_AT_FIELD: ${AUTH_VERIFIED_AT_FIELD:-}
      AUTH_REDIRECT_FIELD: ${AUTH_REDIRECT_FIELD:-}
      AUTH_LOGIN_URL: ${AUTH_LOGIN_URL:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      APP_BASE_PATH: ${APP_BASE_PATH:-/claude-usage}
      INGEST_TOKENS: ${INGEST_TOKENS}
      STREAM_TOKENS: ${STREAM_TOKENS:-}
      STREAM_PING_SEC: ${STREAM_PING_SEC:-15}
      STREAM_MAX_LIFETIME_SEC: ${STREAM_MAX_LIFETIME_SEC:-900}
      STREAM_MAX_CLIENTS: ${STREAM_MAX_CLIENTS:-32}
      STREAM_QUEUE_MAX: ${STREAM_QUEUE_MAX:-32}
      MAX_INGEST_BODY_BYTES: ${MAX_INGEST_BODY_BYTES:-262144}
      MAX_BACKLOG_ENTRIES: ${MAX_BACKLOG_ENTRIES:-200}
      CLOCK_SKEW_TOLERANCE_SEC: ${CLOCK_SKEW_TOLERANCE_SEC:-300}
      SAMPLE_HEARTBEAT_SEC: ${SAMPLE_HEARTBEAT_SEC:-300}
      MONOTONIC_EPS: ${MONOTONIC_EPS:-0.5}
      FRESH_WINDOW_SEC: ${FRESH_WINDOW_SEC:-300}
      CLIENT_SILENT_SEC: ${CLIENT_SILENT_SEC:-21600}
    depends_on:
      claude_usage_monitor_mariadb:
        condition: service_healthy
    networks:
      - claude-usage-monitor_internal
      - claude-usage-monitor_edge
    # On the LOOPBACK by default: a local installation works right away at
    # http://127.0.0.1:8080/claude-usage/, and at the same time nothing goes out to the world
    # until a proxy with TLS and a login is put in front of it.
    #
    # Behind a reverse proxy publishing the port is unnecessary — the proxy reaches the
    # container over the Docker network. It can be taken away ONLY through `ports: !reset []`
    # in docker-compose.override.yml (Compose >= 2.24). `BACKEND_BIND=` is not enough: `:-`
    # fires on an empty value too, so the port comes back to the default.
    ports:
      - "${BACKEND_BIND:-127.0.0.1:8080}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=2).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  # The DB is unreachable from anything but the backend — no egress, no access from the host.
  claude-usage-monitor_internal:
    name: claude-usage-monitor_internal
    driver: bridge
    internal: true
  # The backend needs a second network, because `internal: true` also cuts OUTBOUND traffic:
  # without it AUTH_MODE=verify would have no way to ask the identity service, and publishing
  # the port would have nothing to publish.
  claude-usage-monitor_edge:
    name: claude-usage-monitor_edge
    driver: bridge
