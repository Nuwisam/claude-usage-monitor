name: claude-usage-monitor

services:
  claude_usage_monitor_mariadb:
    image: mariadb:11
    container_name: claude_usage_monitor_mariadb
    restart: unless-stopped
    command: >
      --default-time-zone=+00:00
      --innodb-buffer-pool-size=256M
      --innodb-flush-log-at-trx-commit=2
      --max-connections=64
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      TZ: UTC
    volumes:
      - ./data/mariadb:/var/lib/mysql
    networks:
      - claude-usage-monitor_internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  claude_usage_monitor_backend:
    # Kontekst to katalog repo, nie ./backend — etap `ui` w Dockerfile buduje frontend/.
    # Bez tego COPY frontend/... nie widzi zrodel. Wielkosc kontekstu trzyma .dockerignore.
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        VITE_BASE_PATH: ${APP_BASE_PATH:-/claude-usage}/
    container_name: claude_usage_monitor_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+aiomysql://${MARIADB_USER}:${MARIADB_PASSWORD}@claude_usage_monitor_mariadb:3306/${MARIADB_DATABASE}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: UTC
      # Bez wartosci domyslnej — celowo. Nieustawione AUTH_MODE zatrzymuje kontener na
      # starcie zamiast wybrac za instalujacego, czy dane maja byc otwarte.
      AUTH_MODE: ${AUTH_MODE}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS}
      AUTH_EMAIL_HEADER: ${AUTH_EMAIL_HEADER:-X-Forwarded-Email}
      AUTH_VERIFY_URL: ${AUTH_VERIFY_URL:-}
      AUTH_EMAIL_FIELD: ${AUTH_EMAIL_FIELD:-email}
      AUTH_VERIFIED_AT_FIELD: ${AUTH_VERIFIED_AT_FIELD:-}
      AUTH_REDIRECT_FIELD: ${AUTH_REDIRECT_FIELD:-}
      AUTH_LOGIN_URL: ${AUTH_LOGIN_URL:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      APP_BASE_PATH: ${APP_BASE_PATH:-/claude-usage}
      INGEST_TOKENS: ${INGEST_TOKENS}
      STREAM_TOKENS: ${STREAM_TOKENS:-}
      STREAM_PING_SEC: ${STREAM_PING_SEC:-15}
      STREAM_MAX_LIFETIME_SEC: ${STREAM_MAX_LIFETIME_SEC:-900}
      STREAM_MAX_CLIENTS: ${STREAM_MAX_CLIENTS:-32}
      STREAM_QUEUE_MAX: ${STREAM_QUEUE_MAX:-32}
      MAX_INGEST_BODY_BYTES: ${MAX_INGEST_BODY_BYTES:-262144}
      MAX_BACKLOG_ENTRIES: ${MAX_BACKLOG_ENTRIES:-200}
      CLOCK_SKEW_TOLERANCE_SEC: ${CLOCK_SKEW_TOLERANCE_SEC:-300}
      SAMPLE_HEARTBEAT_SEC: ${SAMPLE_HEARTBEAT_SEC:-300}
      MONOTONIC_EPS: ${MONOTONIC_EPS:-0.5}
      FRESH_WINDOW_SEC: ${FRESH_WINDOW_SEC:-300}
      CLIENT_SILENT_SEC: ${CLIENT_SILENT_SEC:-21600}
    depends_on:
      claude_usage_monitor_mariadb:
        condition: service_healthy
    networks:
      - claude-usage-monitor_internal
      - claude-usage-monitor_edge
    # Domyslnie na PETLI ZWROTNEJ: instalacja lokalna dziala od razu pod
    # http://127.0.0.1:8080/claude-usage/, a jednoczesnie nic nie wychodzi na swiat, dopoki
    # nie postawisz przed tym proxy z TLS-em i logowaniem.
    #
    # Za reverse proxy publikowanie portu jest zbedne — proxy siega kontenera po sieci
    # dockerowej. Zdjac je mozna TYLKO przez `ports: !reset []` w docker-compose.override.yml
    # (Compose >= 2.24). `BACKEND_BIND=` nie wystarczy: `:-` odpala sie takze na wartosci
    # pustej, wiec port wroci na domyslny.
    ports:
      - "${BACKEND_BIND:-127.0.0.1:8080}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=2).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  # DB nieosiagalna z niczego poza backendem — brak egress, brak dostepu z hosta.
  claude-usage-monitor_internal:
    name: claude-usage-monitor_internal
    driver: bridge
    internal: true
  # Backend potrzebuje drugiej sieci, bo `internal: true` odcina takze ruch WYCHODZACY:
  # bez niej AUTH_MODE=verify nie mialby jak zapytac uslugi tozsamosci, a publikowanie
  # portu nie mialoby czego publikowac.
  claude-usage-monitor_edge:
    name: claude-usage-monitor_edge
    driver: bridge
