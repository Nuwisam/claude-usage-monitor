[project]
name = "claude-usage-monitor-backend"
version = "0.1.0"
description = "Podglad aktualnych limitow Claude dla wielu kont, z historia."
requires-python = ">=3.12"
dependencies = [
    "fastapi >=0.115",
    "uvicorn[standard] >=0.32",
    "sqlalchemy[asyncio] >=2.0",
    "aiomysql >=0.2",
    "cryptography >=43",   # wymagane przez aiomysql dla caching_sha2_password (domyslne w MariaDB)
    "alembic >=1.13",
    "pydantic >=2.10",
    "pydantic-settings >=2.6",
    "loguru >=0.7",
    "httpx >=0.27",        # AUTH_MODE=verify: zapytanie do uslugi tozsamosci
]

[project.optional-dependencies]
dev = [
    "pytest >=8",
    "pytest-asyncio >=0.24",
    "aiosqlite >=0.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
